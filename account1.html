<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Helb Assistance Account</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="styles1.css" />
<link rel="stylesheet" href="stylesq.css" />
<link rel="#" href="scrript.js" />
</head>
<body>
<!-- Side Navigation Menu -->
<div class="side-nav">
  <a href="Home.html">Home</a>
  <a href="#profile">Profile</a>
  <a href="#planning">Planning / To-Do</a>
  <a href="count 2.html">Account </a>
</div>

<!-- Main Content with Background Image -->
<div class="main-content">
  <header>
    <h1>HELB ASSISTANT</h1>
    <p>Plan. Save. Prosper. For Kenyan Comrades.</p>
  </header>

  <!-- Profile Section -->
  <section id="profile" class="section">
    <h2>Profile</h2>
    <p>Update your profile informations here.</p>
    <label for="name">First Name:</label>
    <input type="text" id="name" placeholder="Your Name" />
    <label for="name">Second Name</label>
    <input type="text" id="name" placeholder="Your Name" />
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Your Email" />
    <label for="number">Your Phone Number:</label>
    <input type="email" id="email" placeholder="07xxxxxxxx" >
    <button onclick="updateProfile()">Update Profile</button>
  </section>

  <!-- Planning / To-Do List Section -->
  <section id="planning" class="section">
    <h2>Planning & To-Do List</h2>
    <input type="text" id="todo-input" placeholder="New task" />
    <button onclick="addTodo()">Add Task</button>
    <ul id="todo-list"></ul>
  </section>

  <!-- Account Balance Section -->
  <section id="amount" class="section">
    <h2>Account Balance</h2>
    <p>Your current balance is: $<span id="balance">1000</span></p>
  </section>
</div>
<style>
    /* Set background image for entire page */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-image: url('');
  background-size: cover;
  background-position: center;
  color: #141313;
}
* Style the login section */
.login-section {
  max-width: 300px;
  margin: auto;
  padding: 20px;
  background-color: #fff;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}


/* Side Navigation Menu */
.side-nav {
  position: fixed;
  top: 50px;
  left: 0;
  width: 200px;
  height: calc(100% - 50px);
  background-color: rgba(0, 0, 0, 0.6);
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.side-nav a {
  color: #fff;
  text-decoration: none;
  padding: 10px 0;
  margin: 10px 0;
  background-color: rgba(255, 165, 0, 0.7);
  border-radius: 4px;
  text-align: center;
  transition: background-color 0.3s;
}
.side-nav a:hover {
  background-color: rgba(255, 165, 0, 1);
}

/* Main content area to the right of nav */
.main-content {
  margin-left: 220px;
  padding: 20px;
  background-color: rgba(234, 230, 15, 0.8);
  min-height: 100vh;
}

/* Sections styling */
section {
  margin-bottom: 50px;
  padding: 20px;
  background-color: rgba(0,0,0,0.4);
  border-radius: 8px;
}
h1{
  color: orange;
  font-size: xx-large;
  font-weight: bolder;
  font-family: Georgia, 'Times New Roman', Times, serif;
}

h2 {
  margin-top: 0;
}

/* Input styles */
input[type=text], input[type=email] {
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  margin-bottom: 16px;
  border-radius: 4px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 20px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
button:hover {
  background-color: #0056b3;
}
</style>

<script>
    function showProfile() {
      document.querySelector('.login-section').style.display = 'none';
      document.querySelector('.profile-section').style.display = 'block';
    }
  // Function to update profile info (dummy)
  function updateProfile() {
    alert('Profile updated!');
  }

  // Function to add a new task to the to-do list
  function addTodo() {
    const task = document.getElementById('todo-input').value;
    if(task) {
      const li = document.createElement('li');
      li.textContent = task;
      document.getElementById('todo-list').appendChild(li);
      document.getElementById('todo-input').value = '';
    }
  }
</script>

</body>
</html>
